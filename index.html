<!doctype html>

    <script>
      (function() {
        // Intercept Vite HMR WebSocket in cloud preview/iframe environments
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function ViteHmrWebSocket(url, protocols) {
            var urlStr = String(url || '');
            var isVite = protocols === 'vite-hmr' || urlStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('token=') !== -1;
            if (isVite) {
              var target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.protocol = 'vite-hmr';
              target.url = urlStr;
              target.bufferedAmount = 0;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
                target.dispatchEvent(new Event('close'));
              };
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new OriginalWebSocket(url, protocols);
          }
          ViteHmrWebSocket.prototype = OriginalWebSocket.prototype;
          ViteHmrWebSocket.CONNECTING = 0;
          ViteHmrWebSocket.OPEN = 1;
          ViteHmrWebSocket.CLOSING = 2;
          ViteHmrWebSocket.CLOSED = 3;
          window.WebSocket = ViteHmrWebSocket;
        }

        // Filter benign [vite] log messages and prevent unhandled rejections
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = String(reason && reason.message ? reason.message : reason);
          if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      })();
    </script>
